<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FitTrack - Fitness Tracking App</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #0f0f13;
      }

      body {
        min-height: 100vh;
      }

      #root {
        min-height: 100vh;
      }

      @keyframes ft-kb-activate {
        0% {
          background-color: rgba(52, 211, 153, 0.35);
          box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.55);
        }
        100% {
          background-color: rgba(52, 211, 153, 0.1);
          box-shadow: 0 0 0 12px rgba(52, 211, 153, 0);
        }
      }

      .ft-kb-focus {
        outline: 2px solid #a78bfa !important;
        outline-offset: 2px !important;
        box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.28) !important;
      }

      .ft-kb-activate {
        animation: ft-kb-activate 0.45s ease-out;
        border-color: #34d399 !important;
      }

      .ft-kb-nav-focus {
        box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.45) !important;
        outline: 2px solid #a78bfa !important;
        outline-offset: 2px !important;
      }

      .ft-kb-nav-activate {
        animation: ft-kb-activate 0.45s ease-out;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
