<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FitTrack - Fitness Tracking App</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #0f0f13;
      }

      body {
        min-height: 100vh;
      }

      #root {
        min-height: 100vh;
      }

      @keyframes ft-kb-activate {
        0% {
          background-color: rgba(52, 211, 153, 0.35);
          box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.55);
        }
        100% {
          background-color: rgba(52, 211, 153, 0.1);
          box-shadow: 0 0 0 12px rgba(52, 211, 153, 0);
        }
      }

      .ft-kb-focus {
        outline: 2px solid #a78bfa !important;
        outline-offset: 2px !important;
        box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.28) !important;
      }

      .ft-kb-activate {
        animation: ft-kb-activate 0.45s ease-out;
        border-color: #34d399 !important;
      }

      .ft-kb-nav-focus {
        box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.45) !important;
        outline: 2px solid #a78bfa !important;
        outline-offset: 2px !important;
      }

      .ft-kb-nav-activate {
        animation: ft-kb-activate 0.45s ease-out;
      }

      @keyframes ft-kb-btn-pulse {
        0%, 100% { box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.35); }
        50% { box-shadow: 0 0 0 5px rgba(167, 139, 250, 0.55); }
      }

      .ft-kb-btn-focus {
        outline: 2px solid #a78bfa !important;
        outline-offset: 2px !important;
        animation: ft-kb-btn-pulse 1.6s ease-in-out infinite;
        position: relative;
        z-index: 1;
      }

      .ft-kb-focus-indicator {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: rgba(167, 139, 250, 0.12);
        border: 1px solid rgba(167, 139, 250, 0.45);
        border-radius: 999px;
        padding: 4px 10px;
        font-size: 11px;
        color: #c4b5fd;
        margin-bottom: 10px;
      }

      .ft-kb-focus-indicator strong {
        color: #e9d5ff;
        font-weight: 800;
      }

      .ft-kb-hint {
        font-size: 11px;
        color: #6b7280;
        margin-bottom: 8px;
      }

      .ft-kb-modal-backdrop {
        animation: ft-kb-backdrop-in 0.2s ease-out;
      }

      @keyframes ft-kb-backdrop-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
